; Confirmed standard Seeed XIAO ESP32-S3. USB-only diagnostics initially.
[platformio]
default_envs = xiao_usb

[env:xiao_usb]
platform = platformio/espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
monitor_speed = 115200
upload_protocol = esptool
build_src_filter = +<main.cpp>
build_flags =
    -Wall
    -Wextra
    -DKICKBAC_USB_ONLY=1

[env:xiao_wifi]
extends = env:xiao_usb
build_src_filter = +<wifi_probe.cpp>
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
    -DKICKBAC_WIFI_DIAGNOSTIC=1

[env:xiao_device]
extends = env:xiao_wifi
build_src_filter = +<wifi_probe.cpp> +<device_probe.cpp>
lib_deps = bblanchon/ArduinoJson@6.21.6
build_flags =
    ${env:xiao_wifi.build_flags}
    -DKICKBAC_DEVICE_DIAGNOSTIC=1
    -DKICKBAC_OPERATIONAL_NETWORK=1
    -DKICKBAC_MOCK_UPLOAD=1
    -DKICKBAC_PERSIST_DEVICE_AUTH=1
