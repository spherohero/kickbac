[project]
name = "kickbac-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "PyJWT[crypto]>=2.10",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=12",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

# Keep project checks reproducible instead of inheriting user-wide rules.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "BLE", "PLW"]
